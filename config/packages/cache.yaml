framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: 'fast_reserve_%env(APP_ENV)%'

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        app: cache.adapter.redis
        default_redis_provider: 'redis://%env(REDIS_HOST)%:%env(REDIS_PORT)%'

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # HTTP caching for API responses
            app.cache.http:
                adapter: cache.adapter.redis
                default_lifetime: 3600

            # Doctrine query result cache
            doctrine.result_cache_pool:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 3600
                tags: true

            # Short-lived cache for frequently changing data (stock, users, reservations)
            cache.pool.short_lived:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 120
                tags: true

            # Long-lived cache for rarely changing data (warehouses, reference data)
            cache.pool.long_lived:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 3600
                tags: true

when@test:
    framework:
        cache:
            app: cache.adapter.array
            pools:
                app.cache.http:
                    adapter: cache.adapter.array
                doctrine.result_cache_pool:
                    adapter: cache.adapter.array
                cache.pool.short_lived:
                    adapter: cache.adapter.array
                cache.pool.long_lived:
                    adapter: cache.adapter.array
